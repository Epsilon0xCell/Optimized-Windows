<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Bay window in rain: the centre pane streams, eases and clears over the loop while steam rises from the sill mug and rain shadows drift across the cushion dent">
<rect width="1200" height="340" fill="#b9bab2"/>
<!-- rear zone: three panes and their washed view -->
<g>
<rect x="150" y="18" width="900" height="212" fill="#eceeed"/>
<rect x="168" y="36" width="272" height="176" fill="#aebfc9"/>
<rect x="464" y="36" width="272" height="176" fill="#a3aeb4"/>
<rect x="760" y="36" width="272" height="176" fill="#9fb8cc"/>
<rect x="168" y="150" width="272" height="62" fill="#7d9cb8"/>
<rect x="464" y="150" width="272" height="62" fill="#87a3ba"/>
<rect x="760" y="150" width="272" height="62" fill="#7494b4">
<animate attributeName="fill" values="#7494b4;#7494b4;#86a8c8;#7494b4" keyTimes="0;0.55;0.8;1" dur="40s" repeatCount="indefinite"/>
</rect>
<line x1="168" y1="124" x2="440" y2="124" stroke="#eceeed" stroke-width="7"/>
<line x1="464" y1="124" x2="736" y2="124" stroke="#eceeed" stroke-width="7"/>
<line x1="760" y1="124" x2="1032" y2="124" stroke="#eceeed" stroke-width="7"/>
</g>
<!-- side pane rain, one stage behind the centre throughout -->
<g stroke="#eef4f6" stroke-width="2" opacity="0.3">
<line x1="220" y1="48" x2="220" y2="96"/><line x1="300" y1="60" x2="300" y2="128"/><line x1="380" y1="44" x2="380" y2="104"/>
<line x1="820" y1="52" x2="820" y2="110"/><line x1="910" y1="44" x2="910" y2="120"/><line x1="990" y1="58" x2="990" y2="102"/>
<animate attributeName="opacity" values="0.05;0.3;0.75;0.75;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="40s" repeatCount="indefinite"/>
</g>
<!-- centre pane rain: beads, streaming, easing, clear rest -->
<g stroke="#f2f7f8" stroke-width="2.5">
<line x1="500" y1="46" x2="500" y2="130"/><line x1="540" y1="60" x2="540" y2="170"/><line x1="580" y1="42" x2="580" y2="120"/>
<line x1="620" y1="56" x2="620" y2="180"/><line x1="660" y1="44" x2="660" y2="140"/><line x1="700" y1="62" x2="700" y2="160"/>
<animate attributeName="opacity" values="0.25;1;1;0.35;0.06" keyTimes="0;0.25;0.5;0.75;1" dur="40s" repeatCount="indefinite"/>
</g>
<!-- middle zone: sill objects, still; mug steam for the first half of each loop -->
<rect x="130" y="230" width="940" height="16" fill="#eceeed"/>
<g>
<rect x="240" y="188" width="44" height="42" fill="#e8eae6" stroke="#96988f" stroke-width="2"/>
<path d="M284,198 a16,12 0 1 1 0,22" fill="none" stroke="#96988f" stroke-width="4"/>
<path d="M252,182 q6,-12 0,-22 q-6,-10 0,-20" fill="none" stroke="#cfd4d2" stroke-width="3">
<animate attributeName="opacity" values="0.9;0.9;0;0;0.9" keyTimes="0;0.42;0.52;0.92;1" dur="40s" repeatCount="indefinite"/>
</path>
<ellipse cx="420" cy="216" rx="26" ry="10" fill="none" stroke="#3c3a3c" stroke-width="3"/>
<ellipse cx="472" cy="216" rx="26" ry="10" fill="none" stroke="#3c3a3c" stroke-width="3"/>
<rect x="820" y="206" width="104" height="16" fill="#80543f"/><rect x="830" y="190" width="92" height="16" fill="#46607a"/><rect x="840" y="174" width="80" height="16" fill="#68744e"/>
</g>
<!-- front zone: cushion, its dent, and drifting rain shadow -->
<rect x="0" y="246" width="1200" height="94" fill="#ceb684"/>
<g fill="#6e86a8"><rect x="0" y="262" width="26" height="14"/><rect x="52" y="262" width="26" height="14"/><rect x="104" y="262" width="26" height="14"/><rect x="156" y="262" width="26" height="14"/><rect x="208" y="262" width="26" height="14"/><rect x="260" y="262" width="26" height="14"/><rect x="312" y="262" width="26" height="14"/><rect x="364" y="262" width="26" height="14"/><rect x="416" y="262" width="26" height="14"/><rect x="468" y="262" width="26" height="14"/><rect x="520" y="262" width="26" height="14"/><rect x="572" y="262" width="26" height="14"/><rect x="624" y="262" width="26" height="14"/><rect x="676" y="262" width="26" height="14"/><rect x="728" y="262" width="26" height="14"/><rect x="780" y="262" width="26" height="14"/><rect x="832" y="262" width="26" height="14"/><rect x="884" y="262" width="26" height="14"/><rect x="936" y="262" width="26" height="14"/><rect x="988" y="262" width="26" height="14"/><rect x="1040" y="262" width="26" height="14"/><rect x="1092" y="262" width="26" height="14"/><rect x="1144" y="262" width="26" height="14"/></g>
<g fill="#46586a" opacity="0.16">
<polygon points="300,246 390,246 470,340 360,340"><animateTransform attributeName="transform" type="translate" values="0,0; 26,0; 8,0; 0,0" keyTimes="0;0.3;0.7;1" dur="40s" repeatCount="indefinite"/></polygon>
<polygon points="640,246 730,246 810,340 700,340"><animateTransform attributeName="transform" type="translate" values="10,0; -14,0; 4,0; 10,0" keyTimes="0;0.3;0.7;1" dur="40s" repeatCount="indefinite"/></polygon>
</g>
<ellipse cx="600" cy="306" rx="170" ry="20" fill="#b39b6c">
<animate attributeName="ry" values="20;20;20;13;20" keyTimes="0;0.5;0.72;0.85;1" dur="40s" repeatCount="indefinite"/>
</ellipse>
</svg>
